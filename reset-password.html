<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Réinitialiser le mot de passe — Académie de Trading</title>
  <link rel="stylesheet" href="variables.css" />
  <link rel="stylesheet" href="base.css" />
</head>
<body>
  <div class="container">
    <div class="logo">📈 Académie de Trading</div>
    <div class="card">
      <h1 style="margin-top:0;font-size:20px;">Mot de passe oublié</h1>
      <p style="color:var(--color-text-muted);font-size:14px;">
        Entrez votre email, nous vous enverrons un lien pour réinitialiser votre mot de passe.
      </p>

      <div id="formMessage" class="form-message"></div>

      <form id="resetForm" novalidate>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required />
          <div class="field-error" id="emailError"></div>
        </div>

        <button type="submit" class="btn" id="submitBtn">Envoyer le lien</button>
      </form>

      <div class="form-footer">
        <a href="./login.html">Retour à la connexion</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabaseClient.js"></script>
  <script src="validators.js"></script>
  <script src="auth.js"></script>
  <script>
    const form = document.getElementById("resetForm");
    const submitBtn = document.getElementById("submitBtn");
    const formMessage = document.getElementById("formMessage");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      formMessage.className = "form-message";
      formMessage.textContent = "";

      const email = document.getElementById("email").value.trim();
      const emailErr = validateEmail(email);
      showFieldError("emailError", emailErr);
      if (emailErr) return;

      submitBtn.disabled = true;
      submitBtn.textContent = "Envoi...";

      const result = await requestPasswordReset(email);

      submitBtn.disabled = false;
      submitBtn.textContent = "Envoyer le lien";

      formMessage.className = `form-message ${result.success ? "success" : "error"}`;
      formMessage.textContent = result.message;
      if (result.success) form.reset();
    });
  </script>
</body>
</html>
