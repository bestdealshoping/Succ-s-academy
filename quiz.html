<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz — Académie de Trading</title>
  <link rel="stylesheet" href="variables.css" />
  <link rel="stylesheet" href="base.css" />
  <link rel="stylesheet" href="app.css" />
  <link rel="stylesheet" href="quiz.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">
      <div class="page-header">
        <h1 id="quizTitle">Quiz</h1>
      </div>

      <div id="quizMessage" class="form-message"></div>

      <form id="quizForm">
        <div id="questionsContainer">
          <p class="loading-text">Chargement du quiz...</p>
        </div>
        <button type="submit" class="btn" id="submitQuizBtn" style="display:none;margin-top:16px;">
          Valider le quiz
        </button>
      </form>

      <div id="resultCard" class="card" style="display:none;margin-top:24px;">
        <h2 id="resultTitle" style="margin-top:0;"></h2>
        <p id="resultDetail"></p>
        <a class="btn btn-sm" id="resultBackLink" href="/app/academy.html">Retour au cours</a>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabaseClient.js"></script>
  <script src="guards.js"></script>
  <script src="layout.js"></script>
  <script src="config.js"></script>
  <script src="quiz.js"></script>
</body>
</html>
