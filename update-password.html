<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nouveau mot de passe — Académie de Trading</title>
  <link rel="stylesheet" href="variables.css" />
  <link rel="stylesheet" href="base.css" />
</head>
<body>
  <div class="container">
    <div class="logo">📈 Académie de Trading</div>
    <div class="card">
      <h1 style="margin-top:0;font-size:20px;">Choisir un nouveau mot de passe</h1>

      <div id="formMessage" class="form-message"></div>

      <form id="updateForm" novalidate>
        <div class="form-group">
          <label for="password">Nouveau mot de passe</label>
          <input type="password" id="password" name="password" autocomplete="new-password" required />
          <div class="field-error" id="passwordError"></div>
        </div>

        <button type="submit" class="btn" id="submitBtn">Mettre à jour</button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/supabaseClient.js"></script>
  <script src="../assets/js/validators.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script>
    // Supabase place automatiquement une session temporaire via le lien reçu par email
    // (paramètres dans l'URL), permettant l'appel à updateUser ci-dessous.
    const form = document.getElementById("updateForm");
    const submitBtn = document.getElementById("submitBtn");
    const formMessage = document.getElementById("formMessage");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      formMessage.className = "form-message";
      formMessage.textContent = "";

      const password = document.getElementById("password").value;
      const passErr = validatePassword(password);
      showFieldError("passwordError", passErr);
      if (passErr) return;

      submitBtn.disabled = true;
      submitBtn.textContent = "Mise à jour...";

      const result = await updatePassword(password);

      submitBtn.disabled = false;
      submitBtn.textContent = "Mettre à jour";

      formMessage.className = `form-message ${result.success ? "success" : "error"}`;
      formMessage.textContent = result.message;

      if (result.success) {
        setTimeout(() => (window.location.href = "/auth/login.html"), 1500);
      }
    });
  </script>
</body>
</html>
