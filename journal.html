<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Journal de trading — Académie de Trading</title>
  <link rel="stylesheet" href="variables.css" />
  <link rel="stylesheet" href="base.css" />
  <link rel="stylesheet" href="app.css" />
  <link rel="stylesheet" href="journal.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">
      <div class="page-header">
        <h1>Journal de trading</h1>
      </div>

      <div id="journalMessage" class="form-message"></div>

      <form id="entryForm" class="card" style="margin-bottom:24px;">
        <h2 style="margin-top:0;font-size:16px;">Nouvelle entrée</h2>

        <div style="display:flex;gap:12px;flex-wrap:wrap;">
          <div class="form-group" style="flex:1;min-width:140px;">
            <label for="instrument">Instrument</label>
            <input type="text" id="instrument" placeholder="ex: BTC-USD" required />
          </div>
          <div class="form-group" style="flex:1;min-width:120px;">
            <label for="action">Action</label>
            <select id="action">
              <option value="buy">Achat</option>
              <option value="sell">Vente</option>
            </select>
          </div>
          <div class="form-group" style="flex:1;min-width:120px;">
            <label for="amount">Montant ($, optionnel)</label>
            <input type="text" id="amount" inputmode="decimal" placeholder="ex: 500" />
          </div>
        </div>

        <div class="form-group">
          <label for="justification">Justification (objectifs, signaux, risque accepté)</label>
          <textarea id="justification" rows="3" required placeholder="Pourquoi ce trade ? Quel signal avez-vous vu ? Quel est votre objectif et le risque accepté ?"></textarea>
          <div class="field-error" id="justificationError"></div>
        </div>

        <button type="submit" class="btn btn-sm" id="submitEntryBtn">Ajouter au journal</button>
      </form>

      <h2 style="font-size:16px;margin-bottom:12px;">Historique</h2>
      <div id="entriesContainer">
        <p class="loading-text">Chargement...</p>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabaseClient.js"></script>
  <script src="guards.js"></script>
  <script src="layout.js"></script>
  <script src="config.js"></script>
  <script src="journal.js"></script>
</body>
</html>
